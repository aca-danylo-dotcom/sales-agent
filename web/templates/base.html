<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sales Agent{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-icon">◎</span>
            <span>Sales Agent</span>
        </div>
        <nav class="nav">
            <a class="nav-item {% if active_nav == 'worklist' %}active{% endif %}" href="/">
                <span class="nav-icon">◉</span> Сьогодні
            </a>
            <a class="nav-item {% if active_nav == 'my-day' %}active{% endif %}" href="/my-day">
                <span class="nav-icon">☀</span> Мій день
            </a>
            <a class="nav-item {% if active_nav == 'connect' %}active{% endif %}" href="/connect">
                <span class="nav-icon">↥</span> Підключення
            </a>
            <a class="nav-item {% if active_nav == 'settings' %}active{% endif %}" href="/settings">
                <span class="nav-icon">⚙</span> Налаштування
            </a>
            <div class="nav-gap"></div>
            <button type="button" class="nav-item" data-placeholder="Угоди"><span class="nav-icon">▤</span> Угоди</button>
            <button type="button" class="nav-item" data-placeholder="Ліди"><span class="nav-icon">✦</span> Ліди</button>
            <button type="button" class="nav-item" data-placeholder="Завдання"><span class="nav-icon">✓</span> Завдання</button>
            <button type="button" class="nav-item" data-placeholder="Клієнти"><span class="nav-icon">☺</span> Клієнти</button>
            <button type="button" class="nav-item" data-placeholder="Звіти"><span class="nav-icon">▦</span> Звіти</button>
        </nav>
    </aside>
    <main class="content">
        {% block content %}{% endblock %}
    </main>
</div>
<div class="toast" id="toast"></div>
<script src="/static/js/app.js"></script>
</body>
</html>
